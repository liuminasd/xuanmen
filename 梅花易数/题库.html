<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="梅花易数互动题库 — 四阶递进：基础知识·应用理解·案例分析·深度分析，40题全面检验学习成果。">
<title>梅花易数 · 题库</title>
<link rel="stylesheet" href="../共享样式/base.css">
<link rel="stylesheet" href="../共享样式/components.css">
<style>
:root{--font-ui:"Noto Serif SC","Songti SC","STSong",serif}
body{font-family:var(--font-ui);padding-bottom:80px;background:var(--bg)}

.breadcrumb{padding:16px 24px;font-size:.78rem}
.breadcrumb a{color:var(--text-dim);text-decoration:none}
.breadcrumb a:hover{color:var(--gold)}
.breadcrumb span{color:var(--text-dim);margin:0 6px}

.hero{text-align:center;padding:32px 20px 24px;border-bottom:1px solid var(--border);margin-bottom:28px}
.hero h1{font-size:2em;color:var(--gold-lt);letter-spacing:5px;font-weight:300;margin-bottom:8px}
.hero p{color:var(--text-dim);font-size:.85rem;letter-spacing:2px}

.container{max-width:800px;margin:0 auto;padding:0 20px}

/* 分数栏 */
.score-bar{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:0 0 28px;
  padding:16px 20px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius)}
.score-item{text-align:center;min-width:70px}
.score-item .val{font-size:2rem;color:var(--gold);font-weight:300}
.score-item .lbl{font-size:.7rem;color:var(--text-dim);letter-spacing:.06em}

/* 选项卡 */
.tabs{display:flex;gap:8px;justify-content:center;margin-bottom:24px;flex-wrap:wrap}
.tab{padding:10px 20px;border:1px solid var(--border);border-radius:20px;background:var(--card);
  color:var(--text-alt);cursor:pointer;font-size:.82rem;transition:all .2s;font-family:inherit;letter-spacing:.04em;white-space:nowrap}
.tab:hover{border-color:var(--gold);color:var(--gold)}
.tab.active{background:var(--gold-bg);border-color:var(--gold);color:var(--gold);font-weight:600}

/* 题目卡片 */
.question{display:none;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:14px;transition:all .3s}
.question.active{display:block;animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.question .q-header{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px}
.question .q-num{font-size:.8rem;color:var(--gold);font-weight:600;white-space:nowrap;padding-top:2px}
.question .q-badge{font-size:.62rem;padding:2px 8px;border-radius:8px;letter-spacing:.06em;white-space:nowrap}
.q-badge.basic{background:rgba(80,152,200,.1);color:var(--blue);border:1px solid rgba(80,152,200,.2)}
.q-badge.core{background:rgba(212,176,106,.1);color:var(--gold);border:1px solid rgba(212,176,106,.2)}
.q-badge.case{background:rgba(78,168,104,.1);color:var(--green);border:1px solid rgba(78,168,104,.2)}
.q-badge.deep{background:rgba(155,126,196,.1);color:var(--purple);border:1px solid rgba(155,126,196,.2)}
.question .q-text{color:var(--text);font-size:.92rem;line-height:1.8}

.options{margin:8px 0 18px}
.opt{display:block;width:100%;text-align:left;padding:13px 16px;margin:8px 0;
  background:rgba(255,255,255,.015);border:1px solid var(--border);border-radius:var(--radius-sm);
  color:var(--text-alt);cursor:pointer;font-size:.84rem;transition:all .2s;font-family:inherit;line-height:1.6}
.opt:hover{border-color:var(--gold);background:var(--gold-bg);color:var(--text)}
.opt.correct{border-color:var(--green)!important;background:rgba(78,168,104,.1)!important;color:var(--green)!important}
.opt.wrong{border-color:var(--red)!important;background:rgba(224,85,74,.08)!important;color:var(--red)!important}
.opt.show-correct{border-color:var(--green)!important;background:rgba(78,168,104,.05)!important}
.opt:disabled{cursor:default}

.explanation{display:none;background:rgba(212,176,106,.04);border-left:2px solid var(--gold);
  padding:12px 16px;border-radius:0 var(--radius) var(--radius) 0;margin-top:10px;font-size:.82rem;color:var(--text-alt);line-height:1.8}
.explanation.show{display:block}
.explanation strong{color:var(--gold-lt)}

/* 按钮 */
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:20px 0}
.btn{padding:10px 28px;border:1px solid var(--gold);border-radius:20px;
  background:var(--gold-bg);color:var(--gold);cursor:pointer;font-size:.84rem;
  letter-spacing:.05em;transition:all .2s;font-family:inherit}
.btn:hover{background:var(--gold);color:#111}
.btn.reset{border-color:var(--border);background:var(--card);color:var(--text-dim)}
.btn.reset:hover{border-color:var(--red);color:var(--red);background:rgba(224,85,74,.05)}
.btn.wrong-book{border-color:var(--red);background:rgba(224,85,74,.06);color:var(--red)}
.btn.wrong-book:hover{background:rgba(224,85,74,.15);color:var(--red);border-color:var(--red)}
.btn.wrong-book:disabled{opacity:.4;cursor:default;pointer-events:none}

/* 错题本弹窗 */
.modal-overlay{display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.7);align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--card);border:1px solid var(--border-lt);border-radius:var(--radius-lg);max-width:700px;width:95%;max-height:80vh;overflow-y:auto;padding:24px 28px;position:relative}
.modal h3{color:var(--gold-lt);font-size:1.1rem;margin-bottom:4px}
.modal .modal-sub{color:var(--text-dim);font-size:.76rem;margin-bottom:18px}
.modal .modal-close{position:absolute;top:14px;right:18px;background:none;border:none;color:var(--text-dim);font-size:1.4rem;cursor:pointer;transition:color .2s}
.modal .modal-close:hover{color:var(--gold)}
.modal .empty-msg{text-align:center;color:var(--text-dim);padding:40px 20px;font-size:.88rem}
.modal .wrong-item{background:rgba(224,85,74,.04);border:1px solid rgba(224,85,74,.15);border-radius:var(--radius-sm);padding:16px;margin-bottom:12px}
.modal .wrong-item .q-text{color:var(--text);font-size:.84rem;line-height:1.7;margin-bottom:10px}
.modal .wrong-item .wrong-meta{font-size:.74rem;color:var(--text-dim);display:flex;gap:16px;flex-wrap:wrap}
.modal .wrong-item .your-ans{color:var(--red)}
.modal .wrong-item .right-ans{color:var(--green)}
.modal .wrong-item .w-exp{font-size:.78rem;color:var(--text-alt);line-height:1.7;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.04)}
.modal .wrong-item .w-exp strong{color:var(--gold-lt)}

footer{text-align:center;padding:32px;color:var(--text-dim);font-size:.74rem;letter-spacing:2px;margin-top:40px}

/* 进度条 - 全局正确率 */
.progress-mini{height:4px;background:var(--border);border-radius:2px;margin:0 0 28px;overflow:hidden}
.progress-mini-fill{height:100%;background:linear-gradient(90deg,var(--gold-dk),var(--gold-lt));border-radius:2px;transition:width .5s var(--ease)}

@media(max-width:600px){
  .hero h1{font-size:1.4em}.container{padding:0 10px}
  .question{padding:18px 14px}.question .q-text{font-size:.85rem}
  .tab{padding:8px 12px;font-size:.72rem}
  .score-item .val{font-size:1.5rem}
  .modal{padding:16px 14px;width:98%}
}

.with-sidebar{margin-left:0!important}
.topnav{position:sticky;top:0;z-index:100;background:linear-gradient(180deg,rgba(8,7,13,.98),rgba(12,11,21,.95));border-bottom:1px solid var(--border);padding:8px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;backdrop-filter:blur(10px)}
.topnav-back{color:var(--gold);text-decoration:none;font-size:.8rem;font-weight:600;padding:5px 12px;border:1px solid var(--gold);border-radius:14px;white-space:nowrap;transition:all .2s;flex-shrink:0}
.topnav-back:hover{background:var(--gold);color:#111}
.topnav-title{color:var(--text-dim);font-size:.76rem;letter-spacing:.06em;white-space:nowrap}
.topnav-links{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.topnav-links a{color:var(--text-alt);text-decoration:none;font-size:.74rem;padding:4px 12px;border:1px solid var(--border);border-radius:12px;transition:all .2s}
.topnav-links a:hover{border-color:var(--gold);color:var(--gold)}
@media(max-width:600px){.topnav{padding:8px 10px;gap:8px}.topnav-links{margin-left:0}}
</style>
</head>

<script>
// ═══════════════════ 四阶题库 (共40题) ═══════════════════
var QUIZ_DATA = {
  // ── 第一阶：基础知识 (10题) ──
  basic: [
    {q:'八卦取象歌中"乾三连"对应的卦符是什么？',
     opts:['☰（三连横）','☷（六断）','☵（中满）','☲（中虚）'],
     ans:0,
     e:'<strong>乾三连☰、坤六断☷、震仰盂☳、艮覆碗☶、离中虚☲、坎中满☵、兑上缺☱、巽下断☴</strong>。取象歌是记忆八卦符号的入门口诀，必须熟练背诵。'},

    {q:'先天八卦数中，乾卦对应的数字是？',
     opts:['8（坤）','1（乾）','6（坎）','3（离）'],
     ans:1,
     e:'<strong>先天八卦数：乾1、兑2、离3、震4、巽5、坎6、艮7、坤8</strong>。歌诀："乾一兑二离三震四，巽五坎六艮七坤八"。起卦时年月日时数除以8取余，用的就是先天数。'},

    {q:'后天八卦方位中，震卦位于哪个方向？',
     opts:['正南','正北','正东','正西'],
     ans:2,
     e:'<strong>后天八卦方位：震东、兑西、离南、坎北、乾西北、坤西南、艮东北、巽东南</strong>。"帝出乎震"——震为东方，万物之始。断卦时判断方位多参后天八卦。'},

    {q:'五行相生的正确顺序是什么？',
     opts:['金→水→木→火→土','木→火→土→金→水','水→火→木→金→土','土→金→火→水→木'],
     ans:1,
     e:'<strong>木生火、火生土、土生金、金生水、水生木</strong>。相生循环如环无端。体用断卦中，用生体为最吉，体生用为泄气。'},

    {q:'八卦中属于"阳卦"的是哪一组？',
     opts:['坤、巽、离、兑','乾、震、坎、艮','乾、兑、离、震','坤、艮、坎、巽'],
     ans:1,
     e:'<strong>阳卦：乾(父)、震(长男)、坎(中男)、艮(少男)</strong>。阴卦：坤(母)、巽(长女)、离(中女)、兑(少女)。阳卦的特征是多阴爻——震坎艮皆一阳二阴，所谓"阳卦多阴"。'},

    {q:'坎卦的五行属性是什么？',
     opts:['木','火','水','金'],
     ans:2,
     e:'<strong>坎为水、离为火、震巽为木、乾兑为金、坤艮为土</strong>。八卦配五行是体用生克判断的基础——五行关系决定了体用生克的吉凶。'},

    {q:'先天八卦与后天八卦最核心的区别是什么？',
     opts:['只是方位不同，没有本质区别','先天为体(天地定位)，后天为用(流行运转)','先天为用，后天为体','两者完全相同'],
     ans:1,
     e:'<strong>先天八卦讲"对待"——天地定位、山泽通气，是静态的本体</strong>。后天八卦讲"流行"——帝出乎震，是动态的运用。梅花易数<strong>起卦用先天数，断卦参后天方位</strong>，两者各司其职。'},

    {q:'离卦的取象歌是？',
     opts:['乾三连','坤六断','离中虚','坎中满'],
     ans:2,
     e:'<strong>离中虚☲</strong>——上下两阳爻中间一阴爻，外明内暗，象征火焰。"离"通"丽"，代表光明、美丽、文明。八卦之中，离为中女。'},

    {q:'五行相克中，火克什么？',
     opts:['水','木','金','土'],
     ans:2,
     e:'<strong>火克金、金克木、木克土、土克水、水克火</strong>。相克关系在体用中体现为：体克用=小吉（事情可控），用克体=凶（外部不利）。'},

    {q:'兑卦在自然界中代表什么物象？',
     opts:['山','泽','风','雷'],
     ans:1,
     e:'<strong>乾天、坤地、震雷、巽风、坎水、离火、艮山、兑泽</strong>。兑为泽，代表湖泊、沼泽。引申为<strong>喜悦(兑=悦)、口舌、言语、少女</strong>，万物类象中兑卦信息极丰富。'}
  ],

  // ── 第二阶：应用理解 (10题) ──
  core: [
    {q:'用年月日时法起卦：年月日三个数之和为45，除以8余5。上卦应该是什么卦？',
     opts:['乾(1)','巽(5)','坎(6)','坤(8)'],
     ans:1,
     e:'<strong>上卦=(年+月+日)÷8的余数，对应先天数</strong>。余数5对应巽卦(☴)。口诀：1乾2兑3离4震<strong>5巽</strong>6坎7艮8坤。余0则为坤(8)。'},

    {q:'年月日时起卦法中，动爻的确定公式是什么？',
     opts:['(年+月+日)÷6取余','(年+月+日+时)÷6取余','(月+日+时)÷8取余','(年+时)÷6取余'],
     ans:1,
     e:'<strong>动爻=(年+月+日+时)÷6，看余数</strong>。余1=初爻动，余2=二爻动...余0=六爻动。动爻位置决定了体用之分：动爻在下卦→下为用上为体，在上卦→上为用下为体。'},

    {q:'起卦得本卦天风姤(䷫)，上乾下巽。动爻在初爻（下卦最下）。体卦和用卦分别是谁？',
     opts:['体乾、用巽','体巽、用乾','体乾、用乾','无法确定'],
     ans:0,
     e:'<strong>动爻在初爻=下卦动→下卦为用、上卦为体</strong>。天风姤上乾下巽，初爻在下卦→体乾(上卦)、用巽(下卦)。体金用木→体克用，小吉。'},

    {q:'体卦为离(火)，用卦为巽(木)。体用之间的生克关系及吉凶是？',
     opts:['体生用(泄气·小凶)','用生体(大吉)','体克用(小吉)','用克体(凶)'],
     ans:1,
     e:'<strong>巽木(用)→离火(体)=用生体，大吉！</strong>用生体=外部环境生助求测人，事情会主动向有利于求测人的方向发展。五大格局中，用生体为最吉。'},

    {q:'体卦为坎(水)，用卦为坤(土)。这个格局是什么？吉凶如何？',
     opts:['用生体·大吉','体克用·小吉','用克体·凶','比和·吉'],
     ans:2,
     e:'<strong>坤土(用)克坎水(体)=用克体，大凶</strong>。外部环境克制求测人，事情不顺利，困难来自外界。当用克体时，应建议求测人暂避锋芒，等待时机。'},

    {q:'梅花易数中，体卦和用卦分别代表什么？',
     opts:['体卦=外部环境，用卦=求测人','体卦=求测人自身，用卦=所问之事/外部','体卦=未来，用卦=过去','两者无区别'],
     ans:1,
     e:'<strong>体卦=求测人(事主自身)，用卦=所问之事(外部环境)</strong>。体不生不灭、不动不变；用随动而变。体用之间五行生克反映人与事的互动关系，是断卦最核心的维度。'},

    {q:'起卦得火风鼎(䷱)，上离下巽。动爻在第四爻（上卦初爻）。体用如何分？吉凶如何？',
     opts:['体离用巽·体克用','体巽用离·用生体(大吉)','体离用巽·用生体','体巽用离·体生用'],
     ans:1,
     e:'<strong>动爻在第四爻=上卦动→上为用下为体</strong>。体巽(木)用离(火)→用生体(木生火)，大吉！鼎卦本身代表"革新、成就"，用生体+卦名吉=双重利好。'},

    {q:'体卦为震(木)，用卦为乾(金)。若问事业求职，应如何判断？',
     opts:['顺利大吉','用克体，求职有阻碍需谨慎','体用无关，随便断','先难后易'],
     ans:1,
     e:'<strong>乾金(用)克震木(体)=用克体，凶</strong>。求职中外部压力大，竞争对手强，自身处于弱势。金克木还暗示可能遇到强势领导或苛刻条件。建议多做准备，等待良机。'},

    {q:'互卦在梅花易数断卦中的作用是什么？',
     opts:['代替本卦','反映事物发展的中间过程','确定动爻位置','无关紧要'],
     ans:1,
     e:'<strong>互卦反映事物发展的中间过程</strong>。由本卦二三四爻(下互)和三四五爻(上互)组成。本卦=起点、互卦=过程、变卦=结局——三卦串联才能完整呈现事物发展的全貌。'},

    {q:'变卦（之卦）在断卦中代表什么？',

// ═══════════ 状态 ═══════════
var state = {
  totalScore: 0,
  answered: 0,
  correct: 0,
  answeredSet: {},   // { key: userAnsIndex }
  wrongList: [],     // [{ key, q, opts, ans, userAns, e }]
  currentTab: 'basic'
};

function init() {
  state.answeredSet = {};
  state.wrongList = [];
  state.totalScore = 0;
  state.answered = 0;
  state.correct = 0;
  updateScore();
  renderQuestions('basic');
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
  var firstTab = document.querySelector('.tab');
  if (firstTab) firstTab.classList.add('active');
  updateWrongBookBtn();
}

function updateScore() {
  document.getElementById('totalScore').textContent = state.totalScore;
  document.getElementById('answered').textContent = state.answered;
  document.getElementById('correct').textContent = state.correct;
  // 进度条
  var totalQ = 40;
  var pct = totalQ > 0 ? Math.round(state.answered / totalQ * 100) : 0;
  document.getElementById('miniProgress').style.width = pct + '%';
}

function updateWrongBookBtn() {
  var btn = document.getElementById('btnWrongBook');
  document.getElementById('wrongCount').textContent = state.wrongList.length;
  if (state.wrongList.length === 0) {
    btn.disabled = true;
  } else {
    btn.disabled = false;
  }
}

function switchTab(tab) {
  state.currentTab = tab;
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
  document.querySelectorAll('.tab').forEach(function(t){
    var txt = t.textContent;
    if ((tab==='basic' && txt.includes('基础')) ||
        (tab==='core' && txt.includes('应用')) ||
        (tab==='case' && txt.includes('案例')) ||
        (tab==='deep' && txt.includes('深度'))) {
      t.classList.add('active');
    }
  });
  renderQuestions(tab);
}

function renderQuestions(tab) {
  var container = document.getElementById('quizContainer');
  var questions = QUIZ_DATA[tab];
  var badgeMap = { basic: '基础知识', core: '应用理解', case: '案例分析', deep: '深度分析' };
  var clsMap = { basic: 'basic', core: 'core', case: 'case', deep: 'deep' };
  var html = '';
  questions.forEach(function(q, i) {
    var key = tab + '-' + i;
    var answered = state.answeredSet[key] !== undefined;
    var userAns = state.answeredSet[key];
    html += '<div class="question active" id="q-' + key + '">';
    html += '<div class="q-header"><span class="q-num">#' + (i+1) + '</span>';
    html += '<span class="q-badge ' + clsMap[tab] + '">' + badgeMap[tab] + '</span>';
    html += '</div>';
    html += '<div class="q-text">' + q.q + '</div>';
    html += '<div class="options">';
    var labels = ['A', 'B', 'C', 'D'];
    q.opts.forEach(function(opt, j) {
      var cls = 'opt';
      if (answered) {
        if (j === q.ans) cls += ' show-correct';
        if (j === userAns && j !== q.ans) cls += ' wrong';
        if (j === userAns && j === q.ans) cls += ' correct';
      }
      html += '<button class="' + cls + '" ' + (answered ? 'disabled' : '') + ' onclick="answer(\'' + key + '\',' + j + ',' + q.ans + ')">' + labels[j] + '. ' + opt + '</button>';
    });
    html += '</div>';
    html += '<div class="explanation' + (answered ? ' show' : '') + '" id="exp-' + key + '">' + q.e + '</div>';
    html += '</div>';
  });
  container.innerHTML = html;
}

function answer(key, userAns, correctAns) {
  if (state.answeredSet[key] !== undefined) return;
  var isCorrect = userAns === correctAns;
  state.answeredSet[key] = userAns;
  state.answered++;

  if (isCorrect) {
    state.correct++;
    state.totalScore += 10;
  } else {
    // 加入错题本
    var parts = key.split('-');
    var tab = parts[0];
    var idx = parseInt(parts[1], 10);
    var q = QUIZ_DATA[tab][idx];
    state.wrongList.push({
      key: key,
      q: q.q,
      opts: q.opts,
      ans: q.ans,
      userAns: userAns,
      e: q.e
    });
  }

  updateScore();
  updateWrongBookBtn();
  renderQuestions(state.currentTab);
  // 滚动到当前题
  var el = document.getElementById('q-' + key);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function resetAll() {
  if (confirm('确定要重新开始吗？所有答题记录和错题本将被清除。')) {
    init();
  }
}

// ═══════════ 错题本 ═══════════
function openWrongBook() {
  if (state.wrongList.length === 0) return;
  var content = document.getElementById('wrongBookContent');
  var labels = ['A', 'B', 'C', 'D'];
  var html = '';
  state.wrongList.forEach(function(item, i) {
    html += '<div class="wrong-item">';
    html += '<div class="q-text"><strong>#' + (i+1) + '</strong> ' + item.q + '</div>';
    html += '<div class="wrong-meta">';
    html += '<span class="your-ans">你的答案：' + labels[item.userAns] + '. ' + item.opts[item.userAns] + '</span>';
    html += '<span class="right-ans">正确答案：' + labels[item.ans] + '. ' + item.opts[item.ans] + '</span>';
    html += '</div>';
    html += '<div class="w-exp">' + item.e + '</div>';
    html += '</div>';
  });
  content.innerHTML = html;
  document.getElementById('wrongBookOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeWrongBook() {
  document.getElementById('wrongBookOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

// 键盘 ESC 关闭错题本
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeWrongBook();
});

init();
</script>
</body>
</html>
